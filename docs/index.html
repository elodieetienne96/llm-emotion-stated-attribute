<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stated attributes and LLM emotion recognition</title>
<style>
:root{--bg:#fbfaf7;--panel:#fff;--ink:#1c1b18;--muted:#6b675e;--line:#e2ddd3;--accent:#8a2f1e;--accent2:#2f5f8a;--soft:#f2efe8;
 --pos:#2f7d5a;--neg:#b23a3a;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"Source Sans 3","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;position:sticky;top:0;z-index:5}
header h1{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:.01em}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{border:1px solid var(--line);background:var(--soft);padding:5px 11px;border-radius:6px;cursor:pointer;font:inherit;color:var(--ink)}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
section{display:none}section.on{display:block}
h2{font-size:20px;margin:6px 0 10px;font-weight:600}
h3{font-size:16px;margin:22px 0 8px;font-weight:600;color:var(--accent)}
p.note{color:var(--muted);font-size:13.5px;margin:4px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:10px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row>label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
select,input[type=text],input[type=search]{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:#fff;min-width:120px}
table{border-collapse:collapse;font-size:13.5px;width:100%}
th,td{border-bottom:1px solid var(--line);padding:4px 7px;text-align:right;white-space:nowrap}
th{font-weight:600;background:var(--soft);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
.tbl{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:6px}
tr.sel td{background:#fdf1ec}
tr.click{cursor:pointer}tr.click:hover td{background:#f6f2ea}
.kpi{display:flex;flex-wrap:wrap;gap:12px}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:150px}
.kpi b{display:block;font-size:22px;font-weight:600}
.kpi span{font-size:12.5px;color:var(--muted)}
.transcript{font-size:15px;line-height:1.6;background:var(--soft);padding:10px 12px;border-radius:6px}
.transcript b{color:var(--accent2)}
pre{background:#1f1e1b;color:#efece4;padding:12px;border-radius:6px;overflow:auto;font-size:12.5px;line-height:1.45;font-family:var(--mono);white-space:pre-wrap}
pre.light{background:var(--soft);color:var(--ink)}
.bars{display:grid;grid-template-columns:110px 1fr 46px;gap:3px 8px;align-items:center;font-size:13px}
.bars .bar{height:14px;border-radius:3px;background:var(--accent2);min-width:1px}
.bars .bar.ctrl{background:#b9c7d6}
.bars .stack{display:flex;flex-direction:column;gap:2px}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px;background:var(--soft);border:1px solid var(--line);margin:1px}
.emo{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.heat{display:grid;gap:2px;font-size:11.5px}
.heat div{padding:3px 2px;text-align:center;border-radius:2px;min-width:34px}
.heat .hd{background:none;font-weight:600;text-align:right;padding-right:6px;white-space:nowrap}
.heat .hc{background:none;writing-mode:vertical-rl;transform:rotate(180deg);text-align:left;height:175px;font-weight:600;white-space:nowrap}
.sig{font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.file{cursor:pointer;color:var(--accent2);text-decoration:underline;margin-right:10px}
.small{font-size:12.5px;color:var(--muted)}
svg text{font-family:var(--sans)}
a{color:var(--accent2)}
.legend span{margin-right:10px;font-size:12.5px}
.warn{background:#fff6e5;border:1px solid #f0d9a8;padding:8px 10px;border-radius:6px;font-size:13px}
</style>
</head>
<body>
<header>
<h1>Gender bias in LLM emotion recognition from verbalised multimodal transcripts: data, answers, measures</h1>
<nav id="nav"></nav>
</header>
<main>
<section id="overview" class="on"><h2>Overview</h2><div id="overview-body">Loading…</div></section>
<section id="clips"><h2>Clips and transcripts</h2><div id="clips-body"></div></section>
<section id="recognition"><h2>Recognised emotions</h2><div id="recognition-body"></div></section>
<section id="attributes"><h2>Effect of a stated attribute</h2><div id="attributes-body"></div></section>
<section id="combinations"><h2>Two attributes stated together</h2><div id="combinations-body"></div></section>
<section id="generation"><h2>Generated transcripts</h2><div id="generation-body"></div></section>
<section id="check"><h2>Corpus check</h2><div id="check-body"></div></section>
<section id="prompts"><h2>Prompts</h2><div id="prompts-body"></div></section>
<section id="code"><h2>Code</h2><div id="code-body"></div></section>
</main>
<script src="app.js"></script>
</body>
</html>
